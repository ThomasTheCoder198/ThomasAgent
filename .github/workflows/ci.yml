name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: contracts/go.sum
      - uses: go-task/setup-task@v2
        with: { version: "3.54.0" }
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: task test:contracts
      - name: Generated code is up to date
        run: |
          task gen
          git diff --exit-code -- backend-core ragx frontend contracts/postman/thomasagent.postman_collection.json
          untracked="$(git status --porcelain --untracked-files=all | grep '^?? ' || true)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated files after task gen:\n%s\n' "$untracked"
            exit 1
          fi

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend-core/go.sum
      - uses: go-task/setup-task@v2
        with: { version: "3.54.0" }
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-core
          install-only: true
      - name: Format and lint
        run: golangci-lint fmt ./... && golangci-lint run ./...
        working-directory: backend-core
      - run: go test ./... -race -count=1 -p 2
        working-directory: backend-core

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { version: "0.12.22" }
      - run: uv sync --frozen
        working-directory: ragx
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src && uv run pytest -q
        working-directory: ragx
