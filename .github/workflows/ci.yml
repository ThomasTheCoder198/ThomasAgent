name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: contracts/go.sum
      - uses: go-task/setup-task@v2
        with: { version: "3.54.0" }
      - run: task test:contracts
      - name: Generated code is up to date
        run: |
          task gen
          git diff --exit-code -- backend-core ragx frontend

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend-core/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend-core
          install-only: true
      - name: Format and lint
        run: golangci-lint fmt ./... && golangci-lint run ./...
        working-directory: backend-core
      - run: go test ./... -race -count=1
        working-directory: backend-core

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { version: "0.12.22" }
      - run: uv sync --frozen
        working-directory: ragx
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src && uv run pytest -q
        working-directory: ragx
