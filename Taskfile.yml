version: "3"

vars:
  COMPOSE: docker compose --env-file deploy/core/.env -f deploy/core/compose.yaml
  RAGX_COMPOSE: docker compose --env-file deploy/ragx/.env -f deploy/ragx/compose.yaml

tasks:
  gen:
    desc: Regenerate code and the Postman collection from contracts/
    cmds:
      - go run ./cmd/errorcodegen -in errors.yaml -go ../backend-core/internal/errors/errors.go -py ../ragx/src/thomas_ragx/platform/error_codes_gen.py -ts ../frontend/lib/errors/codes.gen.ts
      - go run ./cmd/apptokengen -out app-token.json
      - npm run lint:openapi
      - npm run gen:postman
      - npm run gen:ragx-types
      - task: gen:ragx-client
    dir: contracts

  gen:ragx-client:
    desc: Generate core's ragx client from contracts/openapi/ragx.v1.yaml
    dir: backend-core/internal/platform/ragx
    cmds: [go tool oapi-codegen -config oapi-codegen.yaml ../../../../contracts/openapi/ragx.v1.yaml]

  lint:
    desc: Lint all services
    cmds:
      - task: lint:core
      - task: lint:ragx
      - task: lint:frontend
  fmt:
    desc: Format Go code
    dir: backend-core
    cmds: [golangci-lint fmt ./...]
  lint:core:
    dir: backend-core
    cmds: [golangci-lint fmt ./..., golangci-lint run ./...]
  lint:ragx:
    dir: ragx
    cmds: [uv run ruff check ., uv run ruff format --check ., uv run mypy src]
  lint:frontend:
    desc: Lint and typecheck the frontend
    dir: frontend
    cmds: [bun run lint, bun run typecheck]

  test:
    desc: Test all services
    cmds:
      - task: test:contracts
      - task: test:core
      - task: test:ragx
      - task: test:frontend
  test:contracts:
    dir: contracts
    cmds: [go test ./..., npm test]
  test:core:
    dir: backend-core
    cmds: [go test ./... -count=1 -p 1]
  test:ragx:
    dir: ragx
    cmds: [uv run pytest -q]
  test:frontend:
    desc: Run frontend unit tests
    dir: frontend
    cmds: [bun run test]

  web:dev:
    desc: Run the frontend on the host against real core
    dir: frontend
    cmds: [bun run dev]
  web:dev:mock:
    desc: Run the frontend on the host with fake core
    dir: frontend
    cmds: [bun run dev:mock]

  up:
    desc: Start the core stack
    cmds: ["{{.COMPOSE}} up -d --build --wait"]
  down:
    desc: Stop the core stack
    cmds: ["{{.COMPOSE}} down"]
  up:ragx:
    desc: Start the ragx stack (separate server in production)
    cmds: ["{{.RAGX_COMPOSE}} up -d --build --wait"]
  down:ragx:
    desc: Stop the ragx stack
    cmds: ["{{.RAGX_COMPOSE}} down"]
  ragx:dev-key:
    desc: Create the dev App-token signing key and print RAG_CORE_PUBLIC_KEYS for deploy/ragx/.env
    cmds: ["uv run --directory ragx python ../scripts/app_token_dev.py keygen --out ../deploy/ragx/dev-app-signing-key.pem"]
  ragx:seed-dev:
    desc: Seed an offline embedding model and role into a running dev ragx stack
    cmds: ["{{.RAGX_COMPOSE}} exec -T ragx-api ragx seed-dev"]
  ragx:eval:
    desc: "Score retrieval of a golden set against a live KB: task ragx:eval SET=... ORG=... KB=... [OUT=...]"
    requires:
      vars: [SET, ORG, KB]
    cmds:
      - '{{.RAGX_COMPOSE}} cp "{{.SET}}" ragx-worker:/tmp/golden.jsonl'
      - '{{.RAGX_COMPOSE}} exec -T ragx-worker ragx eval run --set /tmp/golden.jsonl --org "{{.ORG}}" --kb "{{.KB}}" --out /tmp/eval.json'
      - '{{.RAGX_COMPOSE}} cp ragx-worker:/tmp/eval.json "{{.OUT | default "docs/superpowers/reports/m1-3-eval.json"}}"'
  migrate:
    desc: Run database migrations
    cmds: ["{{.COMPOSE}} run --rm migrate"]
  core:serve:
    desc: Run core locally with deploy/core/.env and exported host DB/Redis URLs
    dir: backend-core
    env:
      CORE_ENV_FILE: ../deploy/core/.env
      # serve needs the App signing key; host runs read the dev key `task ragx:dev-key` writes.
      CORE_APP_SIGNING_KEY_FILE: ../deploy/ragx/dev-app-signing-key.pem
    cmds: [go run ./cmd/core serve]
  api-test:
    desc: Run the Postman collection against the running core API
    dir: contracts
    cmds:
      - |
        bash -c '
          set -euo pipefail
          api_test_email="${CORE_AUTH_OWNER_EMAIL:-}"
          api_test_password="${CORE_AUTH_OWNER_PASSWORD:-}"
          if [ -z "$api_test_email" ] || [ -z "$api_test_password" ]; then
            set -a
            source ../deploy/core/.env
            set +a
          fi
          export CORE_AUTH_OWNER_EMAIL="${api_test_email:-$CORE_AUTH_OWNER_EMAIL}"
          export CORE_AUTH_OWNER_PASSWORD="${api_test_password:-$CORE_AUTH_OWNER_PASSWORD}"
          node postman/run.mjs
        '
  smoke:
    desc: Check service health
    cmds: [bash scripts/smoke.sh]
