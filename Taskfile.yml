version: "3"

vars:
  COMPOSE: docker compose --env-file deploy/compose/.env -f deploy/compose/compose.infra.yaml -f deploy/compose/compose.observability.yaml -f deploy/compose/compose.yaml

tasks:
  gen:
    desc: Regenerate code and the Postman collection from contracts/
    cmds:
      - go run ./cmd/errorcodegen -in errors.yaml -go ../backend-core/internal/errors/errors.go -py ../ragx/src/thomas_ragx/platform/error_codes_gen.py -ts ../frontend/lib/errors/codes.gen.ts
      - npm run lint:openapi
      - npm run gen:postman
    dir: contracts

  lint:
    desc: Lint all services
    cmds:
      - task: lint:core
      - task: lint:ragx
  fmt:
    desc: Format Go code
    dir: backend-core
    cmds: [golangci-lint fmt ./...]
  lint:core:
    dir: backend-core
    cmds: [golangci-lint fmt ./..., golangci-lint run ./...]
  lint:ragx:
    dir: ragx
    cmds: [uv run ruff check ., uv run ruff format --check ., uv run mypy src]

  test:
    desc: Test all services
    cmds:
      - task: test:contracts
      - task: test:core
      - task: test:ragx
  test:contracts:
    dir: contracts
    cmds: [go test ./..., npm test]
  test:core:
    dir: backend-core
    cmds: [go test ./... -count=1 -p 1]
  test:ragx:
    dir: ragx
    cmds: [uv run pytest -q]

  up:
    desc: Start the full stack
    cmds: ["{{.COMPOSE}} up -d --build --wait"]
  down:
    desc: Stop the full stack
    cmds: ["{{.COMPOSE}} down"]
  migrate:
    desc: Run database migrations
    cmds: ["{{.COMPOSE}} run --rm migrate"]
  core:serve:
    desc: Run the core API locally using exported CORE_* environment variables
    dir: backend-core
    cmds: [go run ./cmd/core serve]
  api-test:
    desc: Run the Postman collection against the running core API
    dir: contracts
    cmds:
      - |
        bash -c '
          set -euo pipefail
          api_test_email="${CORE_AUTH_OWNER_EMAIL:-}"
          api_test_password="${CORE_AUTH_OWNER_PASSWORD:-}"
          if [ -z "$api_test_email" ] || [ -z "$api_test_password" ]; then
            set -a
            source ../deploy/compose/.env
            set +a
          fi
          export CORE_AUTH_OWNER_EMAIL="${api_test_email:-$CORE_AUTH_OWNER_EMAIL}"
          export CORE_AUTH_OWNER_PASSWORD="${api_test_password:-$CORE_AUTH_OWNER_PASSWORD}"
          node postman/run.mjs
        '
  smoke:
    desc: Check service health
    cmds: [bash scripts/smoke.sh]
