version: 1
errors:
  - code: INTERNAL_ERROR
    status: 500
    retryable: false
    message: { vi: "Đã có lỗi xảy ra. Vui lòng thử lại.", en: "Something went wrong. Please try again." }
  - code: VALIDATION_FAILED
    status: 400
    retryable: false
    message: { vi: "Dữ liệu gửi lên không hợp lệ.", en: "The request data is invalid." }
  - code: UNAUTHENTICATED
    status: 401
    retryable: false
    message: { vi: "Bạn cần đăng nhập.", en: "You need to sign in." }
  - code: FORBIDDEN
    status: 403
    retryable: false
    message: { vi: "Bạn không có quyền thực hiện thao tác này.", en: "You are not allowed to do this." }
  - code: NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy tài nguyên.", en: "The resource was not found." }
  - code: METHOD_NOT_ALLOWED
    status: 405
    retryable: false
    message: { vi: "Phương thức không được hỗ trợ.", en: "This method is not allowed." }
  - code: CONFLICT
    status: 409
    retryable: false
    message: { vi: "Dữ liệu bị xung đột với trạng thái hiện tại.", en: "The request conflicts with the current state." }
  - code: PAYLOAD_TOO_LARGE
    status: 413
    retryable: false
    message: { vi: "Dữ liệu gửi lên quá lớn.", en: "The request payload is too large." }
  - code: RATE_LIMITED
    status: 429
    retryable: true
    message: { vi: "Quá nhiều yêu cầu, vui lòng thử lại sau.", en: "Too many requests, please retry later." }
  - code: UNSUPPORTED_MEDIA_TYPE
    status: 415
    retryable: false
    message: { vi: "Kiểu nội dung yêu cầu không được hỗ trợ.", en: "The request content type is not supported." }
  - code: PROVIDER_UNAVAILABLE
    status: 503
    retryable: true
    message: { vi: "Dịch vụ bên ngoài đang không khả dụng.", en: "An upstream provider is unavailable." }
  - code: DEPENDENCY_TIMEOUT
    status: 504
    retryable: true
    message: { vi: "Dịch vụ phụ thuộc phản hồi quá chậm.", en: "A dependency timed out." }
  - code: CLIENT_NETWORK_ERROR
    status: 503
    retryable: true
    message: { vi: "Không kết nối được tới máy chủ.", en: "Could not reach the server." }
  - code: AUTH_INVALID_CREDENTIALS
    status: 401
    retryable: false
    message: { vi: "Email hoặc mật khẩu không đúng.", en: "Incorrect email or password." }
  - code: AUTH_SESSION_EXPIRED
    status: 401
    retryable: false
    message: { vi: "Phiên đăng nhập đã hết hạn.", en: "Your session has expired." }
  - code: AUTH_CSRF_INVALID
    status: 403
    retryable: false
    message: { vi: "Yêu cầu không hợp lệ, vui lòng tải lại trang.", en: "Invalid request, please reload the page." }
  - code: INTERNAL_TOKEN_INVALID
    status: 401
    retryable: false
    message: { vi: "Token dịch vụ không hợp lệ.", en: "Invalid service token." }
  - code: LLM_PROVIDER_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy provider.", en: "Provider not found." }
  - code: LLM_MODEL_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy model.", en: "Model not found." }
  - code: LLM_ROLE_NOT_ASSIGNED
    status: 404
    retryable: false
    message: { vi: "Vai trò này chưa được gán model.", en: "No model is assigned to this role." }
  - code: LLM_MODEL_CAPABILITY_MISMATCH
    status: 422
    retryable: false
    message: { vi: "Model không có khả năng cần cho vai trò này.", en: "The model lacks a capability this role requires." }
  - code: LLM_PROVIDER_REJECTED
    status: 400
    retryable: false
    message: { vi: "Provider từ chối key hoặc cấu hình.", en: "The provider rejected the key or configuration." }
  - code: LLM_PROVIDER_SYNC_UNSUPPORTED
    status: 400
    retryable: false
    message: { vi: "Provider này chưa hỗ trợ đồng bộ model.", en: "Model sync is not supported for this provider." }
  - code: LLM_MODEL_IN_USE
    status: 409
    retryable: false
    message: { vi: "Model đang được gán cho một vai trò.", en: "The model is assigned to a role." }
  - code: LLM_NAME_TAKEN
    status: 409
    retryable: false
    message: { vi: "Tên này đã được dùng.", en: "This name is already in use." }

  - code: APP_TOKEN_INVALID
    status: 401
    retryable: false
    message: { vi: "Token gọi app không hợp lệ.", en: "The app token is invalid." }
  - code: KB_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy Knowledge Base.", en: "Knowledge Base not found." }
  - code: KB_FILE_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy tài liệu.", en: "File not found." }
  - code: ORG_NOT_PROVISIONED
    status: 409
    retryable: false
    message: { vi: "Tổ chức chưa được khởi tạo trong ragx.", en: "The organization is not provisioned in ragx yet." }
  - code: RAGX_UNAVAILABLE
    status: 503
    retryable: true
    message: { vi: "Dịch vụ tài liệu đang không khả dụng. Vui lòng thử lại.", en: "The document service is unavailable. Please try again." }
  - code: INGEST_CONTENT_CHANGED
    status: 409
    retryable: false
    message: { vi: "Nội dung tệp đã thay đổi sau khi tải lên. Vui lòng tải lại.", en: "The file changed after upload. Please upload it again." }
  - code: INGEST_PARSE_FAILED
    status: 422
    retryable: false
    message: { vi: "Không đọc được nội dung tệp (tệp hỏng hoặc bị khoá).", en: "The file could not be read (corrupt or protected)." }
  - code: INGEST_NO_TEXT
    status: 422
    retryable: false
    message: { vi: "Không tìm thấy chữ nào trong tệp.", en: "No text was found in the file." }
  - code: INGEST_EMBEDDING_MISMATCH
    status: 409
    retryable: false
    message: { vi: "Model embedding trả về số chiều khác với Knowledge Base.", en: "The embedding model returned a different dimension than the Knowledge Base." }
  - code: KB_NODE_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy mục tài liệu.", en: "Document section not found." }
  - code: AGENT_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy agent.", en: "Agent not found." }
  - code: AGENT_KB_INVALID
    status: 422
    retryable: false
    message: { vi: "Knowledge Base không tồn tại trong tổ chức này.", en: "The Knowledge Base does not exist in this organization." }
  - code: CONVERSATION_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy hội thoại.", en: "Conversation not found." }
  - code: RUN_NOT_ACTIVE
    status: 409
    retryable: false
    message: { vi: "Lượt trả lời đã kết thúc.", en: "The run has already finished." }
  - code: RUN_ALREADY_ACTIVE
    status: 409
    retryable: true
    message: { vi: "Hội thoại đang có lượt trả lời chạy.", en: "A run is already in progress in this conversation." }
  - code: RUN_DEADLINE_EXCEEDED
    status: 504
    retryable: true
    message: { vi: "Lượt trả lời quá thời gian cho phép.", en: "The run took too long." }
