version: 1
errors:
  - code: INTERNAL_ERROR
    status: 500
    retryable: false
    message: { vi: "Đã có lỗi xảy ra. Vui lòng thử lại.", en: "Something went wrong. Please try again." }
  - code: VALIDATION_FAILED
    status: 400
    retryable: false
    message: { vi: "Dữ liệu gửi lên không hợp lệ.", en: "The request data is invalid." }
  - code: UNAUTHENTICATED
    status: 401
    retryable: false
    message: { vi: "Bạn cần đăng nhập.", en: "You need to sign in." }
  - code: FORBIDDEN
    status: 403
    retryable: false
    message: { vi: "Bạn không có quyền thực hiện thao tác này.", en: "You are not allowed to do this." }
  - code: NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy tài nguyên.", en: "The resource was not found." }
  - code: METHOD_NOT_ALLOWED
    status: 405
    retryable: false
    message: { vi: "Phương thức không được hỗ trợ.", en: "This method is not allowed." }
  - code: CONFLICT
    status: 409
    retryable: false
    message: { vi: "Dữ liệu bị xung đột với trạng thái hiện tại.", en: "The request conflicts with the current state." }
  - code: PAYLOAD_TOO_LARGE
    status: 413
    retryable: false
    message: { vi: "Dữ liệu gửi lên quá lớn.", en: "The request payload is too large." }
  - code: RATE_LIMITED
    status: 429
    retryable: true
    message: { vi: "Quá nhiều yêu cầu, vui lòng thử lại sau.", en: "Too many requests, please retry later." }
  - code: PROVIDER_UNAVAILABLE
    status: 503
    retryable: true
    message: { vi: "Dịch vụ bên ngoài đang không khả dụng.", en: "An upstream provider is unavailable." }
  - code: DEPENDENCY_TIMEOUT
    status: 504
    retryable: true
    message: { vi: "Dịch vụ phụ thuộc phản hồi quá chậm.", en: "A dependency timed out." }
  - code: CLIENT_NETWORK_ERROR
    status: 503
    retryable: true
    message: { vi: "Không kết nối được tới máy chủ.", en: "Could not reach the server." }
  - code: AUTH_INVALID_CREDENTIALS
    status: 401
    retryable: false
    message: { vi: "Email hoặc mật khẩu không đúng.", en: "Incorrect email or password." }
  - code: AUTH_SESSION_EXPIRED
    status: 401
    retryable: false
    message: { vi: "Phiên đăng nhập đã hết hạn.", en: "Your session has expired." }
  - code: AUTH_CSRF_INVALID
    status: 403
    retryable: false
    message: { vi: "Yêu cầu không hợp lệ, vui lòng tải lại trang.", en: "Invalid request, please reload the page." }
  - code: INTERNAL_TOKEN_INVALID
    status: 401
    retryable: false
    message: { vi: "Token dịch vụ không hợp lệ.", en: "Invalid service token." }
  - code: REGISTRY_PROVIDER_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy provider.", en: "Provider not found." }
  - code: REGISTRY_MODEL_NOT_FOUND
    status: 404
    retryable: false
    message: { vi: "Không tìm thấy model.", en: "Model not found." }
  - code: REGISTRY_ROLE_NOT_ASSIGNED
    status: 404
    retryable: false
    message: { vi: "Vai trò này chưa được gán model.", en: "No model is assigned to this role." }
  - code: REGISTRY_CAPABILITY_MISMATCH
    status: 422
    retryable: false
    message: { vi: "Model không có khả năng cần cho vai trò này.", en: "The model lacks a capability this role requires." }
  - code: REGISTRY_PROVIDER_REJECTED
    status: 400
    retryable: false
    message: { vi: "Provider từ chối key hoặc cấu hình.", en: "The provider rejected the key or configuration." }
  - code: REGISTRY_SYNC_UNSUPPORTED
    status: 400
    retryable: false
    message: { vi: "Provider này chưa hỗ trợ đồng bộ model.", en: "Model sync is not supported for this provider." }
  - code: REGISTRY_MODEL_IN_USE
    status: 409
    retryable: false
    message: { vi: "Model đang được gán cho một vai trò.", en: "The model is assigned to a role." }
  - code: REGISTRY_NAME_TAKEN
    status: 409
    retryable: false
    message: { vi: "Tên này đã được dùng.", en: "This name is already in use." }
