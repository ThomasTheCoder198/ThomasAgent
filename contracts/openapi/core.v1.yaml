openapi: 3.1.0
info:
  title: ThomasAgent Core API
  version: 1.0.0
  description: >-
    All responses use the shared response format {data, meta} or {error}. Error codes come from contracts/errors.yaml.
    JSON request bodies require application/json (charset parameters are supported). Missing, malformed or other media types
    return UNSUPPORTED_MEDIA_TYPE (415). Unknown fields and malformed JSON return VALIDATION_FAILED (400).
    Requiring JSON and rejecting unknown fields are breaking changes for callers that previously relied on permissive decoding.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl: { default: http://localhost:8080 }
tags:
  - name: Health
  - name: Auth
  - name: LLM providers
  - name: LLM models
  - name: LLM model roles
  - name: Organizations
  - name: Apps
security:
  - sessionCookie: []
    csrfHeader: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthStatus" }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthStatus" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: >-
        Login attempts share email/IP, email-global and IP-only budgets before password verification.
        Exhausting any budget returns RATE_LIMITED with Retry-After in seconds. The email-global
        budget can block a correct password for the remaining window; it has no password exemption.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: "{{ownerEmail}}", password: "{{ownerPassword}}" }
      responses:
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "200":
          description: Signed in; sets thomas_session and thomas_csrf cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginSuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Login budget exhausted; wait the Retry-After duration before retrying.
          headers:
            Retry-After:
              description: Remaining blocked-window duration in seconds.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      description: Authenticates the stored session using database time for its expiry decision.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "200": { $ref: "#/components/responses/LogoutResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/providers:
    get:
      tags: [LLM providers]
      operationId: listLLMProviders
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [LLM providers]
      operationId: createLLMProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
            example:
              {
                kind: openrouter,
                name: "OpenRouter {{$randomInt}}",
                baseUrl: "http://127.0.0.1:1",
              }
      responses:
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "201": { $ref: "#/components/responses/Provider" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/providers/{providerId}:
    parameters:
      - {
          name: providerId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
          example: "{{providerId}}",
        }
    patch:
      tags: [LLM providers]
      operationId: updateLLMProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
            example: { enabled: true }
      responses:
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "200": { $ref: "#/components/responses/Provider" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [LLM providers]
      operationId: deleteLLMProvider
      responses:
        "200": { $ref: "#/components/responses/DeleteResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/providers/{providerId}/test:
    parameters:
      - {
          name: providerId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
          example: "{{providerId}}",
        }
    post:
      tags: [LLM providers]
      operationId: testLLMProvider
      responses:
        "200": { $ref: "#/components/responses/ProviderTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/providers/{providerId}/sync:
    parameters:
      - {
          name: providerId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
          example: "{{providerId}}",
        }
    post:
      tags: [LLM providers]
      operationId: syncLLMProviderModels
      responses:
        "200":
          description: Sync counts.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - {
                      type: object,
                      properties:
                        { data: { $ref: "#/components/schemas/SyncResult" } },
                    }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/models:
    get:
      tags: [LLM models]
      operationId: listLLMModels
      parameters:
        - {
            name: providerId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: capability,
            in: query,
            schema: { $ref: "#/components/schemas/Capability" },
          }
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [LLM models]
      operationId: createLLMModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelInput" }
            example:
              {
                providerId: "{{providerId}}",
                modelRef: "openai/gpt-5-mini",
                displayName: "GPT-5 mini",
                capabilities: [chat],
              }
      responses:
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "201": { $ref: "#/components/responses/Model" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/models/{modelId}:
    parameters:
      - {
          name: modelId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
          example: "{{modelId}}",
        }
    delete:
      tags: [LLM models]
      operationId: deleteLLMModel
      responses:
        "200": { $ref: "#/components/responses/DeleteResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/model-roles:
    get:
      tags: [LLM model roles]
      operationId: listLLMModelRoles
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Role assignments.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - {
                      type: object,
                      properties:
                        {
                          data:
                            {
                              type: array,
                              items:
                                { $ref: "#/components/schemas/RoleAssignment" },
                            },
                        },
                    }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/model-roles/{role}:
    parameters:
      - {
          name: role,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/Role" },
          example: chat.fast,
        }
    put:
      tags: [LLM model roles]
      operationId: assignLLMModelRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [modelId],
                properties: { modelId: { type: string, format: uuid } },
              }
            example: { modelId: "{{modelId}}" }
      responses:
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "200": { $ref: "#/components/responses/RoleAssignment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orgs:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      responses:
        "200": { $ref: "#/components/responses/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      description: >-
        Creates the organization, then provisions it in ragx synchronously. Always 201 once the row exists;
        ragxStatus is ready, or failed with ragxErrorCode when ragx refused or was unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
            example: { name: "API test {{$timestamp}}", externalParsing: true }
      responses:
        "201": { $ref: "#/components/responses/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/orgs/{orgId}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid }, example: "{{orgId}}" }
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        "200": { $ref: "#/components/responses/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      description: >-
        Saves the change. A ready org is synced to ragx at once; if that fails it stays ready with settingsSynced
        false and ragxErrorCode set. Other states only save the row; provision sends it later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
            example: { externalParsing: false }
      responses:
        "200": { $ref: "#/components/responses/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/orgs/{orgId}/provision:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid }, example: "{{orgId}}" }
    post:
      tags: [Organizations]
      operationId: provisionOrganization
      description: Provisions (or re-syncs) the org in ragx synchronously from pending, failed or ready; answers its real state.
      responses:
        "200": { $ref: "#/components/responses/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orgs/{orgId}/apps/ragx/{path}:
    parameters:
      - { name: orgId, in: path, required: true, schema: { type: string, format: uuid }, example: "{{orgId}}" }
      - name: path
        in: path
        required: true
        description: Ragx path below /v1 (may contain "/"); ^[A-Za-z0-9._~/-]+$, no "..", no "//", no trailing "/".
        schema: { type: string }
        example: knowledge-bases
    get:
      tags: [Apps]
      operationId: proxyRagxGet
      summary: Read from the ragx app through the proxy
      description: >-
        Generic proxy to ragx's /v1 API (spec ragx-custom-app §14.2). Core does not know ragx's routes: it signs a
        60-second App token for the org in the path (scope kb:read for GET/HEAD, kb:write otherwise) and forwards the
        body, Content-Type, Idempotency-Key, Accept-Language and X-Request-Id only. Ragx 2xx and catalog 4xx come back
        verbatim; a route that needs another scope is 404; ragx 401, 5xx, timeouts and oversized bodies are 503.
      responses:
        "200": { $ref: "#/components/responses/AppProxyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    head:
      tags: [Apps]
      operationId: proxyRagxHead
      summary: Read headers from the ragx app through the proxy
      responses:
        "200": { description: Headers of the app's response }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [Apps]
      operationId: proxyRagxPost
      summary: Create in the ragx app through the proxy
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/AppProxyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    put:
      tags: [Apps]
      operationId: proxyRagxPut
      summary: Replace in the ragx app through the proxy
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/AppProxyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Apps]
      operationId: proxyRagxPatch
      summary: Update in the ragx app through the proxy
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/AppProxyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Apps]
      operationId: proxyRagxDelete
      summary: Delete from the ragx app through the proxy
      responses:
        "200": { $ref: "#/components/responses/AppProxyResponse" }
        "204": { description: No content }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: thomas_session }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token }
  responses:
    AppProxyResponse:
      description: The app's own response, verbatim (2xx, or a 4xx catalog error)
      content:
        application/json:
          schema: {}
    HealthStatus:
      description: Health result.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - { type: object, properties: { data: { type: object, required: [status], properties: { status: { type: string, enum: [ok, ready] } } } } }
    DeleteResult:
      description: Deletion confirmation.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - { type: object, properties: { data: { type: object, required: [deleted], properties: { deleted: { type: boolean } } } } }
    LogoutResult:
      description: Logout confirmation.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - { type: object, properties: { data: { type: object, required: [loggedOut], properties: { loggedOut: { type: boolean } } } } }
    ProviderTestResult:
      description: Provider connection test result.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - { type: object, properties: { data: { type: object, required: [ok, modelCount], properties: { ok: { type: boolean }, modelCount: { type: integer, minimum: 0 } } } } }
    RoleAssignment:
      description: Role assignment.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - { type: object, properties: { data: { $ref: "#/components/schemas/RoleAssignment" } } }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMediaType:
      description: The JSON body requires application/json; missing, malformed or other media types return UNSUPPORTED_MEDIA_TYPE.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication failed or is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated request is not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Provider:
      description: One provider.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties:
                    { data: { $ref: "#/components/schemas/Provider" } },
                }
    ProviderList:
      description: Providers.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Provider" },
                        },
                    },
                }
    Model:
      description: One model.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties: { data: { $ref: "#/components/schemas/Model" } },
                }
    ModelList:
      description: Models.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Model" },
                        },
                    },
                }
    Organization:
      description: One organization.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties:
                    { data: { $ref: "#/components/schemas/Organization" } },
                }
    OrganizationList:
      description: Organizations, ordered by name.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SuccessResponse" }
              - {
                  type: object,
                  properties:
                    {
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Organization" },
                        },
                    },
                }
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties: { requestId: { type: string } }
    SuccessResponse:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              {
                type: string,
                description: "UPPER_SNAKE code from contracts/errors.yaml",
              }
            message: { type: string }
            details: { type: object }
            requestId:
              {
                type: string,
                description: "Same value as the X-Request-Id response header (pattern in contracts/request-id.json)",
              }
    User:
      type: object
      properties:
        {
          id: { type: string, format: uuid },
          email: { type: string },
          displayName: { type: string },
        }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, format: password },
        }
    LoginSuccessResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessResponse" }
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: "#/components/schemas/User" }
                csrfToken: { type: string }
                expiresAt: { type: string, format: date-time }
    ProviderKind:
      type: string
      enum:
        [
          openrouter,
          openai,
          anthropic,
          google,
          azure,
          ollama,
          openai_compatible,
          cohere,
          voyage,
          jina,
          typesafe,
        ]
    Capability:
      type: string
      enum: [chat, tools, vision, reasoning, embedding, rerank, decision]
    Role:
      type: string
      enum: [chat.default, chat.fast, vision, embedding, rerank, decision]
    Provider:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProviderKind" }
        name: { type: string }
        baseUrl: { type: string }
        hasApiKey: { type: boolean }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProviderInput:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/ProviderKind" }
        name: { type: string }
        baseUrl: { type: string }
        apiKey:
          {
            type: [string, "null"],
            writeOnly: true,
            description: "null/absent = unchanged unless baseUrl changes (then cleared), empty string = remove",
          }
        enabled: { type: boolean }
    Model:
      type: object
      properties:
        id: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        modelRef: { type: string }
        displayName: { type: string }
        capabilities:
          { type: array, items: { $ref: "#/components/schemas/Capability" } }
        contextWindow: { type: integer }
        embeddingDims: { type: integer }
        inputPricePerMTok: { type: number }
        outputPricePerMTok: { type: number }
        source: { type: string, enum: [manual, sync] }
    ModelInput:
      type: object
      additionalProperties: false
      required: [providerId, modelRef]
      properties:
        providerId: { type: string, format: uuid }
        modelRef: { type: string }
        displayName: { type: string }
        capabilities:
          { type: array, items: { $ref: "#/components/schemas/Capability" } }
        contextWindow: { type: integer }
        embeddingDims: { type: integer }
        inputPricePerMTok: { type: number }
        outputPricePerMTok: { type: number }
    RoleAssignment:
      type: object
      properties:
        {
          role: { $ref: "#/components/schemas/Role" },
          modelId: { type: string, format: uuid },
        }
    SyncResult:
      type: object
      properties: { added: { type: integer }, updated: { type: integer }, skipped: { type: integer } }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, externalParsing]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        externalParsing: { type: boolean }
    OrganizationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        externalParsing: { type: boolean }
    Organization:
      type: object
      required: [id, name, externalParsing, ragxStatus, ragxErrorCode, settingsSynced, defaultKnowledgeBaseId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        externalParsing: { type: boolean }
        ragxStatus: { type: string, enum: [pending, ready, failed] }
        ragxErrorCode: { type: [string, "null"], description: Catalog code of the last failed ragx sync }
        settingsSynced: { type: boolean, description: False until ragx has the latest name and externalParsing }
        defaultKnowledgeBaseId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
