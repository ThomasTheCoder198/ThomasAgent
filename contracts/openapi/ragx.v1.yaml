openapi: 3.1.0
info:
  title: ThomasAgent ragx API
  version: 1.0.0
  description: >
    Called only by core. Every /v1 operation needs an App token: a 60-second EdDSA JWT signed by core
    (typ thomas-app+jwt; claims iss, aud, oid, optional kb, scp, rid, jti, iat, exp). Ragx takes the organization
    from oid and never from the body. Tool routes need scope tool:<name> and the claim kb.
servers:
  - url: http://localhost:8090
    description: Local ragx stack
security:
  - appToken: []
tags:
  - name: health
  - name: orgs
  - name: knowledge-bases
  - name: files
  - name: tools
  - name: manifest
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness (Postgres, Redis, MinIO)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/orgs/{orgId}:
    put:
      tags: [orgs]
      operationId: provisionOrg
      summary: Create or update an org space (scope org:provision); creates the default KB once
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgProvision" }
      responses:
        "200":
          description: Org space
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Org" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases:
    get:
      tags: [knowledge-bases]
      operationId: listKnowledgeBases
      summary: List the org's Knowledge Bases (scope kb:read)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Knowledge Bases, default first, then by name
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/KnowledgeBase" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      tags: [knowledge-bases]
      operationId: createKnowledgeBase
      summary: Create a Knowledge Base (scope kb:write)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseWrite" }
      responses:
        "201": { $ref: "#/components/responses/KnowledgeBase" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [knowledge-bases]
      operationId: getKnowledgeBase
      summary: Get a Knowledge Base (scope kb:read)
      responses:
        "200": { $ref: "#/components/responses/KnowledgeBase" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [knowledge-bases]
      operationId: renameKnowledgeBase
      summary: Rename a Knowledge Base (scope kb:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeBaseWrite" }
      responses:
        "200": { $ref: "#/components/responses/KnowledgeBase" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [knowledge-bases]
      operationId: deleteKnowledgeBase
      summary: Delete a Knowledge Base (scope kb:write); the default KB cannot be deleted
      responses:
        "204": { description: "Deleted; files, vectors and objects are purged by a job" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [files]
      operationId: listFiles
      summary: List files, newest first (scope kb:read)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: One page of files
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/KbFile" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/uploads:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [files]
      operationId: createUpload
      summary: >-
        Start a presigned upload (scope kb:write). Creates an 'uploading' file (hidden from every read until
        confirmed) and returns a MinIO POST policy for exactly sizeBytes, signed for the public storage endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "201":
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/UploadTicket" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files/{fileId}/confirm:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [files]
      operationId: confirmUpload
      summary: >-
        Finish a presigned upload (scope kb:write). Idempotent by fileId: a repeat returns the same file, and
        duplicate content returns the existing file. 400 file MISSING when the object is not in storage yet.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" } }
      responses:
        "200": { $ref: "#/components/responses/KbFile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files/{fileId}/download-url:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [files]
      operationId: getDownloadUrl
      summary: Short-lived presigned GET (scope kb:read) that always downloads as attachment + application/octet-stream
      responses:
        "200":
          description: Download link
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DownloadUrl" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/RequestId"
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file (scope kb:write); objects and vectors are purged by a job
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files/{fileId}/retry:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [files]
      operationId: retryFile
      summary: Queue a failed file for ingest again (scope kb:write)
      responses:
        "200": { $ref: "#/components/responses/KbFile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/knowledge-bases/{kbId}/files/{fileId}/preview:
    parameters:
      - $ref: "#/components/parameters/KbId"
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [files]
      operationId: getFilePreview
      summary: Stream the preview JSON produced by ingest (scope kb:read); 404 until ingest writes it (M1.3)
      responses:
        "200":
          description: Preview blocks
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/manifest:
    get:
      tags: [manifest]
      operationId: getManifest
      summary: App manifest (scope kb:read) with the KB tools
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Manifest
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Manifest" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/tools/kb_search:
    post:
      tags: [tools]
      operationId: kbSearch
      summary: Hybrid search in the token's KB (scope tool:kb_search; KB from the kb claim)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbSearchInput" }
      responses:
        "200":
          description: Labelled passages
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KbSearchOutput" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/tools/kb_outline:
    post:
      tags: [tools]
      operationId: kbOutline
      summary: Read from the token's KB (scope tool:kb_outline; KB from the kb claim)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbOutlineInput" }
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KbOutlineOutput" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/tools/kb_read_section:
    post:
      tags: [tools]
      operationId: kbReadSection
      summary: Read from the token's KB (scope tool:kb_read_section; KB from the kb claim)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbReadSectionInput" }
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/KbReadSectionOutput" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/tools/kb_list_documents:
    post:
      tags: [tools]
      operationId: kbListDocuments
      summary: Read from the token's KB (scope tool:kb_list_documents; KB from the kb claim)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbListDocumentsInput" }
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/KbDocument" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    appToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" }
    KbId:
      name: kbId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, pattern: "^(req|job)_[A-Za-z0-9-]{8,64}$" }
  responses:
    Health:
      description: Status
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string }
              meta: { $ref: "#/components/schemas/Meta" }
    KnowledgeBase:
      description: Knowledge Base
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: "#/components/schemas/KnowledgeBase" }
              meta: { $ref: "#/components/schemas/Meta" }
    KbFile:
      description: File
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: "#/components/schemas/KbFile" }
              meta: { $ref: "#/components/schemas/Meta" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
    PageMeta:
      type: object
      required: [requestId, page]
      properties:
        requestId: { type: string }
        page:
          type: object
          required: [cursor, limit]
          properties:
            cursor: { type: [string, "null"], description: Cursor of the next page; null on the last page }
            limit: { type: integer }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            requestId: { type: string }
    OrgProvision:
      type: object
      additionalProperties: false
      required: [name, externalParsing]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        externalParsing: { type: boolean }
    Org:
      type: object
      required: [orgId, name, externalParsing, defaultKbId, createdAt]
      properties:
        orgId: { type: string }
        name: { type: string }
        externalParsing: { type: boolean }
        defaultKbId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    KnowledgeBaseWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    KnowledgeBase:
      type: object
      required: [id, name, isDefault, embeddingModel, embeddingDims, fileCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        embeddingModel: { type: string }
        embeddingDims: { type: integer }
        fileCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UploadRequest:
      type: object
      additionalProperties: false
      required: [name, sizeBytes]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
    UploadTicket:
      type: object
      required: [fileId, upload, expiresAt]
      properties:
        fileId: { type: string, format: uuid }
        upload:
          type: object
          required: [url, fields]
          properties:
            url: { type: string, format: uri, description: Storage POST URL (public endpoint + bucket) }
            fields: { type: object, additionalProperties: { type: string }, description: Form fields to send before the file field }
        expiresAt: { type: string, format: date-time }
    DownloadUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    KbFileStatus:
      { type: string, enum: [pending, parsing, enriching, chunking, embedding, indexing, ready, failed, degraded] }
    KbFile:
      type: object
      required: [id, kbId, name, version, contentType, sizeBytes, sha256, status, errorCode, degraded, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kbId: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        status: { $ref: "#/components/schemas/KbFileStatus" }
        errorCode: { type: string }
        degraded: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Manifest:
      type: object
      required: [name, version, tools]
      properties:
        name: { type: string }
        version: { type: string }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolDefinition" } }

    Locator:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [pdf_bbox, sheet_range, text_lines, docx_paragraph] }
        page: { type: integer, minimum: 1 }
        bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        sheet: { type: string }
        range: { type: string }
        lineStart: { type: integer, minimum: 1 }
        lineEnd: { type: integer, minimum: 1 }
        paragraph: { type: integer, minimum: 0 }
    KbSearchInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        filters:
          type: object
          additionalProperties: false
          properties:
            fileIds: { type: array, maxItems: 20, items: { type: string, format: uuid } }
            docTypes: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 12 } }
    LabelledBlock:
      type: object
      required: [label, blockId, text, locator]
      properties:
        label: { type: string, example: "[1.2]" }
        blockId: { type: string }
        text: { type: string }
        locator: { $ref: "#/components/schemas/Locator" }
    SearchResult:
      type: object
      required: [source, chunkId, fileId, fileName, nodeId, section, pageStart, pageEnd, score, blocks]
      properties:
        source: { type: integer, minimum: 1 }
        chunkId: { type: string }
        fileId: { type: string, format: uuid }
        fileName: { type: string }
        nodeId: { type: string, format: uuid }
        section: { type: array, items: { type: string } }
        pageStart: { type: [integer, "null"] }
        pageEnd: { type: [integer, "null"] }
        score: { type: number }
        blocks: { type: array, items: { $ref: "#/components/schemas/LabelledBlock" } }
    KbSearchOutput:
      type: object
      required: [results, insufficientEvidence]
      properties:
        results: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/SearchResult" } }
        insufficientEvidence: { type: boolean }
    ToolDefinition:
      type: object
      required: [name, description, inputSchema, timeoutMs, failureMode, public]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema: { type: object }
        timeoutMs: { type: integer, minimum: 1 }
        failureMode: { type: string, enum: [skip, abort] }
        public: { type: boolean }
    KbOutlineInput:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId: { type: string, format: uuid }
    OutlineNode:
      type: object
      required: [nodeId, parentId, depth, title, summary]
