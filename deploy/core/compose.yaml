name: thomas

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

x-core-env: &core-env
  CORE_ENV: ${CORE_ENV:-dev}
  CORE_SERVICE_NAME: ${CORE_SERVICE_NAME:-thomas-core}
  CORE_HTTP_ADDR: ${CORE_HTTP_ADDR:-:8080}
  CORE_SHUTDOWN_TIMEOUT: ${CORE_SHUTDOWN_TIMEOUT:-15s}
  CORE_READ_HEADER_TIMEOUT: ${CORE_READ_HEADER_TIMEOUT:-10s}
  CORE_LOG_LEVEL: ${CORE_LOG_LEVEL:-info}
  CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
  CORE_AUTH_OWNER_EMAIL: ${CORE_AUTH_OWNER_EMAIL}
  CORE_AUTH_OWNER_PASSWORD: ${CORE_AUTH_OWNER_PASSWORD}
  CORE_VAULT_MASTER_KEY: ${CORE_VAULT_MASTER_KEY}
  CORE_VAULT_KEY_ID: ${CORE_VAULT_KEY_ID:-v1}
  CORE_HTTP_MAX_BODY_BYTES: ${CORE_HTTP_MAX_BODY_BYTES:-1048576}
  CORE_HTTP_REQUEST_TIMEOUT: ${CORE_HTTP_REQUEST_TIMEOUT:-30s}
  CORE_HTTP_EVENT_STREAM_HEARTBEAT: ${CORE_HTTP_EVENT_STREAM_HEARTBEAT:-15s}
  CORE_HTTP_EVENT_STREAM_WRITE_TIMEOUT: ${CORE_HTTP_EVENT_STREAM_WRITE_TIMEOUT:-10s}
  CORE_AUTH_SESSION_TTL: ${CORE_AUTH_SESSION_TTL:-720h}
  CORE_AUTH_COOKIE_SECURE: ${CORE_AUTH_COOKIE_SECURE:-false}
  CORE_AUTH_LOGIN_MAX_ATTEMPTS: ${CORE_AUTH_LOGIN_MAX_ATTEMPTS:-10}
  CORE_AUTH_LOGIN_EMAIL_MAX_ATTEMPTS: ${CORE_AUTH_LOGIN_EMAIL_MAX_ATTEMPTS:-20}
  CORE_AUTH_LOGIN_IP_MAX_ATTEMPTS: ${CORE_AUTH_LOGIN_IP_MAX_ATTEMPTS:-100}
  CORE_AUTH_LOGIN_WINDOW: ${CORE_AUTH_LOGIN_WINDOW:-15m}
  CORE_AUTH_MIN_PASSWORD_LENGTH: ${CORE_AUTH_MIN_PASSWORD_LENGTH:-12}
  CORE_AUTH_SESSION_PURGE_INTERVAL: ${CORE_AUTH_SESSION_PURGE_INTERVAL:-1h}
  CORE_AUTH_SESSION_TOUCH_INTERVAL: ${CORE_AUTH_SESSION_TOUCH_INTERVAL:-5m}
  CORE_AUTH_PASSWORD_HASH_ITERATIONS: ${CORE_AUTH_PASSWORD_HASH_ITERATIONS:-2}
  CORE_AUTH_PASSWORD_HASH_MEMORY_KIB: ${CORE_AUTH_PASSWORD_HASH_MEMORY_KIB:-65536}
  CORE_AUTH_PASSWORD_HASH_MAX_CONCURRENCY: ${CORE_AUTH_PASSWORD_HASH_MAX_CONCURRENCY:-4}
  CORE_AUTH_PASSWORD_HASH_PARALLELISM: ${CORE_AUTH_PASSWORD_HASH_PARALLELISM:-1}
  CORE_AUTH_PASSWORD_HASH_SALT_LENGTH: ${CORE_AUTH_PASSWORD_HASH_SALT_LENGTH:-16}
  CORE_AUTH_PASSWORD_HASH_KEY_LENGTH: ${CORE_AUTH_PASSWORD_HASH_KEY_LENGTH:-32}
  CORE_PROVIDER_HTTP_TIMEOUT: ${CORE_PROVIDER_HTTP_TIMEOUT:-20s}
  CORE_PROVIDER_MAX_RESPONSE_BYTES: ${CORE_PROVIDER_MAX_RESPONSE_BYTES:-8388608}
  CORE_PROVIDER_PRIVATE_ALLOWLIST: ${CORE_PROVIDER_PRIVATE_ALLOWLIST:-}
  CORE_PROVIDER_MAX_REMOTE_MODELS: ${CORE_PROVIDER_MAX_REMOTE_MODELS:-1000}
  CORE_PROVIDER_MAX_BREAKERS: ${CORE_PROVIDER_MAX_BREAKERS:-256}
  CORE_PROVIDER_BREAKER_FAILURE_THRESHOLD: ${CORE_PROVIDER_BREAKER_FAILURE_THRESHOLD:-5}
  CORE_PROVIDER_BREAKER_OPEN_TIMEOUT: ${CORE_PROVIDER_BREAKER_OPEN_TIMEOUT:-30s}
  CORE_PROVIDER_BREAKER_HALF_OPEN_MAX_CALLS: ${CORE_PROVIDER_BREAKER_HALF_OPEN_MAX_CALLS:-1}
  CORE_AUTH_TRUSTED_PROXY_HEADER: ${CORE_AUTH_TRUSTED_PROXY_HEADER:-}
  CORE_AUTH_TRUSTED_PROXY_CIDRS: ${CORE_AUTH_TRUSTED_PROXY_CIDRS:-}
  CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
  CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/0}
  CORE_LOGS_OTLP_ENDPOINT: ${CORE_LOGS_OTLP_ENDPOINT-http://victorialogs:9428/insert/opentelemetry/v1/logs}
  CORE_RETRY_MAX_ATTEMPTS: ${CORE_RETRY_MAX_ATTEMPTS:-4}
  CORE_RETRY_BASE_DELAY: ${CORE_RETRY_BASE_DELAY:-200ms}
  CORE_RETRY_MAX_DELAY: ${CORE_RETRY_MAX_DELAY:-10s}
  CORE_STREAM_MAX_DELIVERIES: ${CORE_STREAM_MAX_DELIVERIES:-4}
  CORE_STREAM_VISIBILITY_TIMEOUT: ${CORE_STREAM_VISIBILITY_TIMEOUT:-30s}
  CORE_STREAM_BLOCK_TIMEOUT: ${CORE_STREAM_BLOCK_TIMEOUT:-5s}
  CORE_STREAM_BATCH_SIZE: ${CORE_STREAM_BATCH_SIZE:-16}
  CORE_RELAY_BATCH_SIZE: ${CORE_RELAY_BATCH_SIZE:-100}
  CORE_RELAY_POLL_INTERVAL: ${CORE_RELAY_POLL_INTERVAL:-500ms}
  CORE_METRICS_ADDR: ${CORE_METRICS_ADDR-:9464}
  CORE_METRICS_HTTP_BUCKETS: ${CORE_METRICS_HTTP_BUCKETS:-0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10}
  CORE_METRICS_LLM_BUCKETS: ${CORE_METRICS_LLM_BUCKETS:-0.25,0.5,1,2,4,8,16,32,64}
  CORE_LLM_LOG_CONTENT: ${CORE_LLM_LOG_CONTENT:-false}
  CORE_LLM_LOG_CONTENT_MAX_BYTES: ${CORE_LLM_LOG_CONTENT_MAX_BYTES:-16384}

services:
  postgres:
    image: postgres:18.6-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ../../backend-core
    logging: *logging
    env_file: [{path: .env, required: false}]
    command: ["migrate", "up"]
    environment: *core-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  core:
    build: ../../backend-core
    logging: *logging
    env_file: [{path: .env, required: false}]
    command: ["serve"]
    environment: *core-env
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/core", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      # No dependency on victorialogs: core must start without observability (spec §1.2); the exporter retries.

  outbox-relay:
    build: ../../backend-core
    logging: *logging
    env_file: [{path: .env, required: false}]
    command: ["outbox-relay"]
    environment: *core-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  victorialogs:
    build: ./victorialogs
    image: thomas-victorialogs:v1.53.0
    logging: *logging
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=${VL_RETENTION:-30d}"]
    volumes: [victorialogs-data:/vlogs]
    ports: ["127.0.0.1:9428:9428"]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.0.10
    entrypoint: ["/bin/sh", "/etc/grafana/render-provisioning.sh"]
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource@0.32.0
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_PHOENIX_URL: ${GRAFANA_PHOENIX_URL:-http://localhost:6006}
      GRAFANA_ALERT_5XX_RATIO: ${GRAFANA_ALERT_5XX_RATIO:-0.05}
      GRAFANA_ALERT_P95_SECONDS: ${GRAFANA_ALERT_P95_SECONDS:-2}
      GRAFANA_ALERT_DLQ_JOBS: ${GRAFANA_ALERT_DLQ_JOBS:-0}
    volumes:
      - ./grafana/entrypoint.sh:/etc/grafana/render-provisioning.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      prometheus: { condition: service_healthy }
      victorialogs: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  victorialogs-data:
  prometheus-data:
  grafana-data:
