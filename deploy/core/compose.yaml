name: thomas

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql]
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ../../backend-core
    env_file: [{path: .env, required: false}]
    command: ["migrate", "up"]
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/0}
      CORE_LOGS_OTLP_ENDPOINT: ${CORE_LOGS_OTLP_ENDPOINT-http://victorialogs:9428/insert/opentelemetry/v1/logs}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  core:
    build: ../../backend-core
    env_file: [{path: .env, required: false}]
    command: ["serve"]
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/0}
      CORE_LOGS_OTLP_ENDPOINT: ${CORE_LOGS_OTLP_ENDPOINT-http://victorialogs:9428/insert/opentelemetry/v1/logs}
      # ragx is a separate stack (a separate server in production); in dev it publishes 8090 on the host.
      CORE_RAGX_URL: ${CORE_RAGX_URL:-http://host.docker.internal:8090}
      CORE_APP_SIGNING_KEY_FILE: /run/secrets/app-signing-key.pem
    volumes:
      # Dev mounts the key `task ragx:dev-key` writes; production mounts core's own key here.
      - ${CORE_APP_SIGNING_KEY_HOST_FILE:-../ragx/dev-app-signing-key.pem}:/run/secrets/app-signing-key.pem:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/core", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      # No dependency on victorialogs: core must start without observability (spec §1.2); the exporter retries.

  core-worker:
    build: ../../backend-core
    env_file: [{path: .env, required: false}]
    command: ["worker"]
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/0}
      CORE_LOGS_OTLP_ENDPOINT: ${CORE_LOGS_OTLP_ENDPOINT-http://victorialogs:9428/insert/opentelemetry/v1/logs}
      # The chat run loop calls ragx tools, so the worker signs App tokens like core does.
      CORE_RAGX_URL: ${CORE_RAGX_URL:-http://host.docker.internal:8090}
      CORE_APP_SIGNING_KEY_FILE: /run/secrets/app-signing-key.pem
    volumes:
      - ${CORE_APP_SIGNING_KEY_HOST_FILE:-../ragx/dev-app-signing-key.pem}:/run/secrets/app-signing-key.pem:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/core", "healthcheck", "--target", "worker"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }

  victorialogs:
    build: ./victorialogs
    image: thomas-victorialogs:v1.53.0
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=${VL_RETENTION:-30d}"]
    volumes: [victorialogs-data:/vlogs]
    ports: ["127.0.0.1:9428:9428"]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.0.10
    entrypoint: ["/bin/sh", "/etc/grafana/render-provisioning.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource@0.32.0
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_PHOENIX_URL: ${GRAFANA_PHOENIX_URL:-http://localhost:6006}
      GRAFANA_ALERT_5XX_RATIO: ${GRAFANA_ALERT_5XX_RATIO:-0.05}
      GRAFANA_ALERT_P95_SECONDS: ${GRAFANA_ALERT_P95_SECONDS:-2}
      GRAFANA_ALERT_DLQ_JOBS: ${GRAFANA_ALERT_DLQ_JOBS:-0}
    volumes:
      - ./grafana/entrypoint.sh:/etc/grafana/render-provisioning.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      prometheus: { condition: service_healthy }
      victorialogs: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  victorialogs-data:
  prometheus-data:
  grafana-data:
