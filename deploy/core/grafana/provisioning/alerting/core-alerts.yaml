apiVersion: 1
groups:
  - orgId: 1
    name: core
    folder: Core
    interval: 1m
    rules:
      - uid: core-5xx-ratio
        title: Core 5xx ratio above threshold
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(http_server_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(http_server_requests_total[5m])), 1e-9)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [${GRAFANA_ALERT_5XX_RATIO}] }
      - uid: core-p95-latency
        title: Core p95 latency above threshold
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [${GRAFANA_ALERT_P95_SECONDS}] }
      - uid: core-dlq
        title: Jobs moved to the dead-letter stream
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(jobs_dlq_total[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [${GRAFANA_ALERT_DLQ_JOBS}] }
