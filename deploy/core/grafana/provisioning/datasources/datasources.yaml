apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The request_id exemplar opens Explore on VictoriaLogs filtered to that request.
      exemplarTraceIdDestinations:
        - name: request_id
          urlDisplayLabel: Logs for this request
          url: '/explore?schemaVersion=1&panes=%7B%22logs%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22uid%22%3A%22victorialogs%22%2C%22type%22%3A%22victoriametrics-logs-datasource%22%7D%2C%22expr%22%3A%22request_id%3A%5C%22$${__value.raw}%5C%22%22%2C%22queryType%22%3A%22instant%22%2C%22groupBy%22%3A%22severity_text%22%2C%22editorMode%22%3A%22code%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22$${__from}%22%2C%22to%22%3A%22$${__to}%22%7D%7D%7D'
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    jsonData:
      logLevelRules:
        - { field: severity_text, operator: equals, value: DEBUG, level: debug, enabled: true }
        - { field: severity_text, operator: equals, value: INFO, level: info, enabled: true }
        - { field: severity_text, operator: equals, value: WARN, level: warning, enabled: true }
        - { field: severity_text, operator: equals, value: ERROR, level: error, enabled: true }
      derivedFields:
        - name: ragx_trace_id
          matcherType: label
          matcherRegex: ragx_trace_id
          url: '${GRAFANA_PHOENIX_URL}/redirects/traces/$${__value.raw}'
          urlDisplayLabel: Open in Phoenix
