name: thomas-ragx

services:
  ragx-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ragx
      POSTGRES_PASSWORD: ${RAGX_POSTGRES_PASSWORD}
      POSTGRES_DB: ragx
    volumes: [ragx-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragx -d ragx"]
      interval: 5s
      timeout: 3s
      retries: 20

  ragx-redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ragx-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["${QDRANT_HOST_PORT:-6333}:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-admin}
    volumes: [phoenix-data:/mnt/data]
    ports: ["${PHOENIX_HOST_PORT:-6006}:6006"]
    healthcheck:
      # Distroless image: its Python performs the probe without a shell or wget.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

  ragx-bootstrap:
    build: ../../ragx
    command: ["bootstrap"]
    env_file: [{path: .env, required: false}]
    environment:
      RAG_DATABASE_URL: postgresql://ragx:${RAGX_POSTGRES_PASSWORD}@ragx-postgres:5432/ragx
      RAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Bootstrap can finish before Phoenix is ready; its startup spans stay local.
      RAG_OTLP_ENDPOINT: ""
    depends_on:
      ragx-postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  ragx-api:
    build: ../../ragx
    command: ["serve"]
    env_file: [{path: .env, required: false}]
    environment:
      RAG_DATABASE_URL: postgresql://ragx:${RAGX_POSTGRES_PASSWORD}@ragx-postgres:5432/ragx
      RAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RAG_OTLP_ENDPOINT: ${RAG_OTLP_ENDPOINT-http://phoenix:6006}
      RAG_PHOENIX_API_KEY: ${RAG_PHOENIX_API_KEY:-${PHOENIX_ADMIN_SECRET}}
    ports: ["8090:8090"]
    depends_on:
      ragx-bootstrap: { condition: service_completed_successfully }
      ragx-redis: { condition: service_healthy }

  ragx-worker:
    build: ../../ragx
    command: ["worker"]
    env_file: [{path: .env, required: false}]
    environment:
      RAG_DATABASE_URL: postgresql://ragx:${RAGX_POSTGRES_PASSWORD}@ragx-postgres:5432/ragx
      RAG_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      RAG_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RAG_OTLP_ENDPOINT: ${RAG_OTLP_ENDPOINT-http://phoenix:6006}
      RAG_PHOENIX_API_KEY: ${RAG_PHOENIX_API_KEY:-${PHOENIX_ADMIN_SECRET}}
    healthcheck:
      # The worker has no HTTP port; it touches its heartbeat file on every poll (RAG_WORKER_HEARTBEAT_FILE).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/ragx-worker.heartbeat') < 60 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    depends_on:
      ragx-bootstrap: { condition: service_completed_successfully }
      ragx-redis: { condition: service_healthy }

volumes:
  ragx-postgres-data:
  ragx-redis-data:
  qdrant-data:
  minio-data:
  phoenix-data:
