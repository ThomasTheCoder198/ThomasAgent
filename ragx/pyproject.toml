[project]
name = "thomas-ragx"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "argon2-cffi==25.1.0",
  "beautifulsoup4==4.15.0",
  "cryptography==50.0.1",
  "datalab-python-sdk==0.5.0",
  "fastapi==0.142.2",
  "fastembed==0.8.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "litellm==1.101.2",
  "lxml==6.1.3",
  "markdown-it-py==4.2.0",
  "minio==7.2.20",
  "openai==2.54.0",
  "openinference-instrumentation==0.1.66",
  "openinference-instrumentation-litellm==0.1.46",
  "openinference-semantic-conventions==0.1.39",
  "onnxruntime==1.30.0",
  "openpyxl==3.1.5",
  "opentelemetry-api==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "pydantic-settings==2.15.0",
  "PyJWT==2.15.0",
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "pyyaml==6.0.3",
  "qdrant-client==1.19.1",
  "redis==8.1.0",
  "structlog==26.1.0",
  "tenacity==9.1.4",
  "typer==0.27.2",
  "uvicorn[standard]==0.54.0",
  "underthesea==9.5.0",
]

[project.scripts]
ragx = "thomas_ragx.cli:app"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==2.4.0", "testcontainers[minio,redis,qdrant]==4.15.0"]
spike = ["pyvi==0.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thomas_ragx"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["src/thomas_ragx/platform/error_codes_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "TRY", "C90", "PLR2004", "RUF", "S"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pymupdf.*", "pptx.*", "openpyxl.*", "datalab_sdk.*", "fastembed.*", "underthesea.*", "pyvi.*", "openinference.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs Docker (testcontainers Postgres, Redis, MinIO)"]

[tool.uv]
# Newer releases of these transitive packages are younger than 14 days (planning check 2026-10-11).
constraint-dependencies = ["soupsieve==2.10", "mmh3==5.3.0"]
