[project]
name = "thomas-ragx"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.15.0",
  "structlog==26.1.0",
  "tenacity==9.1.4",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "minio==7.2.20",
  "qdrant-client==1.19.1",
  "typer==0.27.2",
]

[project.scripts]
ragx = "thomas_ragx.cli:app"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thomas_ragx"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["src/thomas_ragx/platform/error_codes_gen.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "TRY", "C90", "PLR2004", "RUF", "S"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
