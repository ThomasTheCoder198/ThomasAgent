RAG_ENV: dev
service_name: thomas-ragx
http_host: 0.0.0.0
http_port: 8090
log_level: info
otlp_endpoint: ""
phoenix_project: thomas-ragx
trace_content: false
app_token_issuer: thomas-core
app_token_audience: ragx
app_token_leeway_seconds: 10
app_token_max_lifetime_seconds: 60
database_pool_min_size: 1
database_pool_max_size: 5
database_connect_timeout_seconds: 10.0
readiness_timeout_seconds: 2.0
redis_url: redis://ragx-redis:6379/0
qdrant_url: http://qdrant:6333
minio_endpoint: minio:9000
minio_secure: false
s3_public_endpoint: http://localhost:9000
s3_region: us-east-1
upload_url_ttl: 900
download_url_ttl: 60
buckets: [kb-raw, kb-preview, chat-attachments]
upload_max_bytes: 104857600
idempotency_ttl_seconds: 86400
page_default_limit: 20
page_max_limit: 100
retry_max_attempts: 4
RAG_RETRY_BASE_DELAY_S: 0.2
RAG_RETRY_MAX_DELAY_S: 10.0
outbox_batch_size: 100
outbox_poll_interval_seconds: 1.0
stream_batch_size: 10
stream_block_milliseconds: 5000
stream_visibility_timeout_milliseconds: 60000
stream_max_deliveries: 3
worker_heartbeat_file: /tmp/ragx-worker.heartbeat
worker_metrics_export_interval_milliseconds: 60000
admin_email: ""
ui_session_ttl_seconds: 43200
ui_cookie_secure: false
ui_login_max_attempts: 5
ui_login_window_seconds: 900
