RAG_ENV: dev
service_name: thomas-ragx
http_host: 0.0.0.0
http_port: 8090
log_level: info
otlp_endpoint: ""
phoenix_project: thomas-ragx
trace_content: false
app_token_issuer: thomas-core
app_token_audience: ragx
app_token_leeway_seconds: 10
app_token_max_lifetime_seconds: 60
database_pool_min_size: 1
database_pool_max_size: 5
database_connect_timeout_seconds: 10.0
readiness_timeout_seconds: 2.0
redis_url: redis://ragx-redis:6379/0
# Must exceed stream_block_milliseconds (XREADGROUP BLOCK is bound by it); still caps a dead connection.
redis_socket_timeout_seconds: 15.0
qdrant_url: http://qdrant:6333
minio_endpoint: minio:9000
minio_secure: false
s3_public_endpoint: http://localhost:9000
s3_region: us-east-1
upload_url_ttl: 900
download_url_ttl: 60
buckets: [kb-raw, kb-preview, chat-attachments]
upload_max_bytes: 52428800
idempotency_ttl_seconds: 86400
page_default_limit: 20
page_max_limit: 100
retry_max_attempts: 4
RAG_RETRY_BASE_DELAY_S: 0.2
RAG_RETRY_MAX_DELAY_S: 10.0
outbox_batch_size: 100
outbox_poll_interval_seconds: 1.0
stream_batch_size: 10
stream_block_milliseconds: 5000
stream_visibility_timeout_milliseconds: 60000
stream_max_deliveries: 3
worker_heartbeat_file: /tmp/ragx-worker.heartbeat
worker_metrics_export_interval_milliseconds: 60000
admin_email: ""
ui_session_ttl_seconds: 43200
ui_cookie_secure: false
ui_login_max_attempts: 5
ui_login_window_seconds: 900
ingest_concurrency: 2
ingest_visibility_timeout_milliseconds: 1800000
worker_heartbeat_interval_seconds: 10.0
sweep_interval_seconds: 600.0
upload_sweep_grace_seconds: 300
work_dir: /tmp/ragx-work
ocr_base_url: https://www.datalab.to
datalab_mode: balanced
datalab_retry_mode: accurate
datalab_min_quality: 3.0
datalab_timeout_seconds: 600.0
datalab_poll_interval_seconds: 2
datalab_skip_cache: false
local_first_extensions: [.docx, .pptx]
chunk_target_words: 350
chunk_max_words: 700
chunk_overlap_words: 50

vi_tokenizer: underthesea
bm25_k: 1.2
bm25_b: 0.75
bm25_avg_len: 256.0
qdrant_upsert_batch_size: 128
qdrant_timeout_seconds: 30

node_summaries_enabled: true
node_summary_max_nodes: 200
node_summary_input_chars: 4000
node_summary_max_tokens: 120

embedding_batch_size: 100

search_dense_limit: 40
search_sparse_limit: 40
search_fused_limit: 30
search_result_limit: 8
search_min_rerank_score: 0.1

tool_timeout_ms: 20000
section_max_chars: 8000
outline_max_nodes: 500
