{# One station rather than a card: the roundel heads a stem that leads into the copy. #}
<section class="empty-station">
  <span class="station-roundel" aria-hidden="true"></span>
  <span class="station-stem" aria-hidden="true"></span>
  <div>
    <h2>{{ title }}</h2>
    <p class="lead">{{ body }}</p>
  </div>
</section>
